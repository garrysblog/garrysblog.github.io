    <h1>Example rgb565 Colors</h1>

        // Function to convert RGB565 to RGB888
        function rgb565ToRgb(rgb565) {
            const r = (rgb565 >> 11) & 0x1F;
            const g = (rgb565 >> 5) & 0x3F;
            const b = rgb565 & 0x1F;
            
            // Scale to 8-bit values
            const r8 = (r * 255) / 31;
            const g8 = (g * 255) / 63;
            const b8 = (b * 255) / 31;
            
            return `rgb(${Math.round(r8)}, ${Math.round(g8)}, ${Math.round(b8)})`;
        }

            nameCell.textContent = name;
            
            const codeCell = document.createElement('td');
            codeCell.textContent = '0x' + code.toString(16).toUpperCase().padStart(4, '0');
            
            const sampleCell = document.createElement('td');
            const colorDiv = document.createElement('div');
            colorDiv.className = 'color-sample';
            colorDiv.style.backgroundColor = rgb565ToRgb(code);
            sampleCell.appendChild(colorDiv);

        });
